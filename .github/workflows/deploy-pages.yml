name: Deploy GitHub Pages + Hetzner DNS

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Subdomain (z.B. prototype)'
        required: true
      domain:
        description: 'Domain (z.B. ob5.dev)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "📋 Setup"
        id: setup
        run: |
          SUBDOMAIN="${{ inputs.subdomain }}"
          DOMAIN="${{ inputs.domain }}"
          FULL_DOMAIN="${SUBDOMAIN}.${DOMAIN}"
          DOMAIN_REV=$(echo "${DOMAIN}" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s", $i, (i>1?"." : "")}')
          REPO_NAME="${DOMAIN_REV}.${SUBDOMAIN}"
          echo "full_domain=${FULL_DOMAIN}" >> $GITHUB_OUTPUT
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "subdomain=${SUBDOMAIN}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT

      - name: "1️⃣ Create Repo"
        continue-on-error: true
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/user/repos -d "{\"name\":\"${{ steps.setup.outputs.repo_name }}\",\"description\":\"GitHub Pages für ${{ steps.setup.outputs.full_domain }}\",\"private\":false}"

      - name: "⏳" 
        run: sleep 5

      - name: "2️⃣ Enable Pages"
        continue-on-error: true
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/wbgrds/${{ steps.setup.outputs.repo_name }}/pages -d "{\"source\":{\"branch\":\"main\"}}"

      - name: "3️⃣ Hetzner Zone"
        id: htz
        run: |
          Z=$(curl -s -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" "https://dns.hetzner.com/api/v1/zones?name=${{ steps.setup.outputs.domain }}" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "zone=${Z}" >> $GITHUB_OUTPUT

      - name: "4️⃣ CNAME"
        run: |
          curl -s -X POST -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" -H "Content-Type: application/json" https://dns.hetzner.com/api/v1/records -d "{\"type\":\"CNAME\",\"name\":\"${{ steps.setup.outputs.subdomain }}\",\"value\":\"wbgrds.github.io\",\"zone_id\":\"${{ steps.htz.outputs.zone }}\",\"ttl\":3600}"

      - name: "⏳"
        run: sleep 5

      - name: "5️⃣ Clone"
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wbgrds/${{ steps.setup.outputs.repo_name }}.git deploy && cd deploy && git config user.email "auto@wbgrds.de" && git config user.name "Bot"

      - name: "6️⃣ Files"
        run: |
          cd deploy && echo "${{ steps.setup.outputs.full_domain }}" > CNAME && echo "# ${{ steps.setup.outputs.full_domain }}" > README.md && cat > index.html << 'HTML'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>${{ steps.setup.outputs.full_domain }}</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.c{background:white;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.15);padding:50px;max-width:500px;text-align:center}h1{font-size:32px;color:#333;margin-bottom:15px}.d{color:#999;font-family:monospace;margin:30px 0;font-size:13px}.s{background:#f8f8f8;border:1px solid #e0e0e0;border-radius:8px;padding:20px;margin-top:30px;text-align:left;font-size:13px;color:#666;line-height:1.8}</style></head><body><div class="c"><h1>✨ Bereit</h1><div class="d">${{ steps.setup.outputs.full_domain }}</div><div class="s">✓ Repo erstellt<br>✓ Pages aktiviert<br>✓ DNS konfiguriert</div></div></body></html>
          HTML

      - name: "7️⃣ Push"
        run: |
          cd deploy && git add . && git commit -m "🚀 Initial: GitHub Pages" && git push -u origin main

      - name: "✅ Done"
        run: |
          echo "✓ ${{ steps.setup.outputs.full_domain }}"
          echo "✓ https://github.com/wbgrds/${{ steps.setup.outputs.repo_name }}"