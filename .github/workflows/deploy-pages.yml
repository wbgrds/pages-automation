name: Deploy GitHub Pages + Hetzner DNS

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Subdomain (z.B. prototype)'
        required: true
        type: string
      domain:
        description: 'Domain (z.B. ob5.dev)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📋 Setup
        run: |
          # Domain reverse: ob5.dev -> dev.ob5.prototype
          DOMAIN_PARTS=$(echo "${{ inputs.domain }}" | tr '.' ' ')
          REPO_NAME=$(echo $DOMAIN_PARTS | awk '{print $NF}' FS=' ')
          for part in $(echo $DOMAIN_PARTS | tr ' ' '
' | tac); do
            REPO_NAME="${part}.${REPO_NAME}"
          done
          REPO_NAME="${REPO_NAME}.${{ inputs.subdomain }}"
          REPO_NAME=$(echo "$REPO_NAME" | sed 's/^\.//')
          
          echo "FULL_DOMAIN=${{ inputs.subdomain }}.${{ inputs.domain }}" >> $GITHUB_ENV
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV
          echo "✓ Repo Name: ${REPO_NAME}"

      - name: 1️⃣ Erstelle GitHub Repo
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/repos \
            -d "{
              \"name\": \"${{ env.REPO_NAME }}\",
              \"description\": \"GitHub Pages für ${{ env.FULL_DOMAIN }}\",
              \"homepage\": \"https://${{ env.FULL_DOMAIN }}\",
              \"private\": false
            }"

      - name: ⏳ Warte
        run: sleep 5

      - name: 2️⃣ Aktiviere GitHub Pages
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/wbgrds/${{ env.REPO_NAME }}/pages \
            -d "{
              \"source\": {
                \"branch\": \"main\",
                \"path\": \"/\"
              }
            }"

      - name: 3️⃣ Hole Hetzner Zone ID
        id: zone
        run: |
          RESPONSE=$(curl -s \
            -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" \
            "https://dns.hetzner.com/api/v1/zones?name=${{ inputs.domain }}")
          
          ZONE_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "zone_id=$ZONE_ID" >> $GITHUB_OUTPUT

      - name: 4️⃣ Setze Hetzner CNAME
        run: |
          curl -s -X POST \
            -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://dns.hetzner.com/api/v1/records \
            -d "{
              \"type\": \"CNAME\",
              \"name\": \"${{ inputs.subdomain }}\",
              \"value\": \"wbgrds.github.io\",
              \"zone_id\": \"${{ steps.zone.outputs.zone_id }}\",
              \"ttl\": 3600
            }"

      - name: ⏳ Warte
        run: sleep 5

      - name: 5️⃣ Klone Repo
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/wbgrds/${{ env.REPO_NAME }}.git deploy
          cd deploy
          git config user.email "claude@wbgrds.de"
          git config user.name "Claude"

      - name: 6️⃣ Erstelle Seite
        run: |
          cd deploy
          
          cat > index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="de">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Willkommen</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: system-ui; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
                  .container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 40px; max-width: 600px; text-align: center; }
                  h1 { color: #333; margin-bottom: 10px; }
                  .domain { font-size: 14px; color: #999; font-family: monospace; margin-bottom: 20px; }
                  p { color: #666; line-height: 1.6; margin-bottom: 30px; }
                  .status { background: #f0f0f0; padding: 15px; border-radius: 5px; font-size: 12px; color: #666; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>✨ Bereit</h1>
                  <div class="domain" id="domain">${{ env.FULL_DOMAIN }}</div>
                  <p>GitHub Pages aktiv</p>
                  <div class="status">
                      ✓ Repo erstellt<br>
                      ✓ Pages aktiviert<br>
                      ✓ DNS konfiguriert
                  </div>
              </div>
          </body>
          </html>
          HTML
          
          echo "${{ env.FULL_DOMAIN }}" > CNAME
          cat > README.md << 'README'
          # ${{ env.FULL_DOMAIN }}
          
          GitHub Pages Site
          
          https://${{ env.FULL_DOMAIN }}
          README

      - name: 7️⃣ Push
        run: |
          cd deploy
          git add .
          git commit -m "Initial: GitHub Pages setup"
          git push -u origin main

      - name: ✅ Done
        run: |
          echo "✅ ${{ env.FULL_DOMAIN }}"
          echo "Repo: https://github.com/wbgrds/${{ env.REPO_NAME }}"