name: Test Token Validity

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Test 1: Is token valid at all? ==="
          curl -s -H "Authorization: Bearer ${{ secrets.HETZNER_TOKEN }}" https://api.hetzner.cloud/v1/servers | python3 -m json.tool 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.HETZNER_TOKEN }}" https://api.hetzner.cloud/v1/servers
          
      - run: |
          echo ""
          echo "=== Test 2: List all available endpoints ==="
          curl -s -H "Authorization: Bearer ${{ secrets.HETZNER_TOKEN }}" https://api.hetzner.cloud/v1/ | python3 -m json.tool 2>/dev/null || curl -s -H "Authorization: Bearer ${{ secrets.HETZNER_TOKEN }}" https://api.hetzner.cloud/v1/
