name: Find Correct Hetzner API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== Test 1: Current URL ==="
          curl -i -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" https://dns.hetzner.com/api/v1/zones 2>&1 | head -20
          
      - run: |
          echo "=== Test 2: Try different endpoint ==="
          curl -i -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" https://api.hetzner.com/api/v1/zones 2>&1 | head -20
          
      - run: |
          echo "=== Test 3: Try without dns subdomain ==="
          curl -i -H "Auth-API-Token: ${{ secrets.HETZNER_TOKEN }}" https://hetzner.com/api/dns/v1/zones 2>&1 | head -20
